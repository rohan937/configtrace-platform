[alembic]
# Path to migration scripts, relative to this file's location.
script_location = alembic

# Add the backend directory to sys.path so `from app.models import Base` works.
prepend_sys_path = .

# Revision filename template.
file_template = %%(rev)s_%%(slug)s

# OS-appropriate path separator for version_locations.
version_path_separator = os

# Truncate the slug portion of generated filenames to this length.
truncate_slug_length = 40

# sqlalchemy.url is intentionally left as a placeholder.
# alembic/env.py reads DATABASE_URL from the environment at runtime so the
# same alembic.ini works both inside Docker and in local development without
# hardcoding credentials here.
sqlalchemy.url = driver://user:pass@localhost/dbname


[post_write_hooks]
# hooks = lint
# lint.type = exec
# lint.executable = ruff
# lint.options = check --select I %(output_file)s


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
