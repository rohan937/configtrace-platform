<?xml version="1.0" encoding="UTF-8"?>
<!--
  ConfigTrace browser-extension icon — source of truth.
  Rendered as a 128x128 square with an 8px transparent margin.
  Inner 112x112 rounded square (radius 22) filled with the ConfigTrace
  brand blue. White "CT" letterforms drawn as axis-aligned strokes for
  legibility at 16/32/48 px.

  PNG renderings live next to this file:
    icon16.png  icon32.png  icon48.png  icon128.png
  They are generated by ./generate_icons.py (pure Python stdlib).
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 128 128" width="128" height="128">
  <!-- background -->
  <rect x="8" y="8" width="112" height="112" rx="22" ry="22" fill="#4B7CF6"/>

  <!-- C: left bar + top bar + bottom bar (stroke width 8) -->
  <rect x="24" y="34" width="8"  height="60" fill="#FFFFFF"/>
  <rect x="24" y="34" width="36" height="8"  fill="#FFFFFF"/>
  <rect x="24" y="86" width="36" height="8"  fill="#FFFFFF"/>

  <!-- T: top bar + centered vertical (stroke width 8) -->
  <rect x="68" y="34" width="36" height="8"  fill="#FFFFFF"/>
  <rect x="82" y="34" width="8"  height="60" fill="#FFFFFF"/>
</svg>
