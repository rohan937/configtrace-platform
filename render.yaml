# render.yaml — ConfigTrace infrastructure-as-code for Render
#
# Defines three services:
#   1. configtrace-api    — FastAPI web service (Docker, Render-injected $PORT)
#   2. configtrace-worker — Celery background worker (Docker)
#   3. configtrace-beat   — Celery Beat scheduler (Docker, M23)
#
# External dependencies created separately in your provider dashboards:
#   PostgreSQL  →  Neon, Supabase, or Render Postgres
#   Redis       →  Upstash or Render Redis
#
# After first deploy, set all envVars marked "sync: false" in the Render
# dashboard (service → Environment tab) or via the Render CLI.
#
# Full deployment guide: docs/deployment.md

services:
  # ── Backend API ──────────────────────────────────────────────────────────────
  - type: web
    name: configtrace-api
    runtime: docker
    plan: starter
    rootDir: backend
    dockerfilePath: ./Dockerfile
    # Render injects $PORT at runtime. dockerCommand overrides the Dockerfile CMD
    # which hardcodes port 8000 — necessary because Render's router expects the
    # app to bind the port it advertises.
    # Note: startCommand is for native runtimes only; Docker runtime uses dockerCommand.
    dockerCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    # Migrations run before each new deploy. Alembic upgrade head is idempotent
    # (a no-op if the schema is already current).
    preDeployCommand: alembic upgrade head
    envVars:
      # Non-secret values set here — safe to commit.
      - key: ENVIRONMENT
        value: production
      - key: BACKEND_CORS_ORIGINS
        value: https://app.configtrace.org,https://configtrace.org

      # Secrets — set these in the Render dashboard, never in this file.
      # sync: false means Render will prompt for the value on first deploy.
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      # Milestone 21 — JWKS endpoint used to verify Clerk JWTs.  Missing or
      # placeholder values cause every protected route to return HTTP 503.
      - key: CLERK_JWKS_URL
        sync: false

  # ── Celery worker ────────────────────────────────────────────────────────────
  # Processes sync tasks enqueued by POST /syncs.
  # Shares the same Docker image as the API; only the dockerCommand differs.
  - type: worker
    name: configtrace-worker
    runtime: docker
    plan: starter
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerCommand: celery -A app.workers.celery_app worker --loglevel=info
    envVars:
      - key: ENVIRONMENT
        value: production

      # Must match the API service — worker reads the same DB and Redis.
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      # Worker doesn't verify JWTs at runtime; setting CLERK_JWKS_URL keeps
      # the image surface identical to the API and avoids drift.
      - key: CLERK_JWKS_URL
        sync: false

  # ── Celery Beat scheduler (Milestone 23) ────────────────────────────────────
  # Fires the ``enqueue_scheduled_syncs`` task at minute 0 of every hour.
  # The task itself is tiny — it sends a Redis message that the worker picks
  # up.  Beat does NOT spawn prefork worker children and does NOT execute
  # sync work itself, so a small Starter plan is plenty.
  #
  # Steady-state memory: ~50-80 MB.  Beat is single-process by design.
  - type: worker
    name: configtrace-beat
    runtime: docker
    plan: starter
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerCommand: celery -A app.workers.celery_app beat --loglevel=info
    envVars:
      - key: ENVIRONMENT
        value: production

      # Beat reads only Redis (broker) at runtime; it never opens a DB
      # connection.  The DB-touching work happens inside the
      # ``enqueue_scheduled_syncs`` task, which runs on configtrace-worker.
      # We still set DATABASE_URL here so pydantic-settings doesn't fail
      # at import time (the Settings class declares DATABASE_URL as required).
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      # Match the worker service's env surface for parity, even though Beat
      # never verifies JWTs.  Avoids subtle drift if a future code path lands
      # in the beat process's import graph.
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_JWKS_URL
        sync: false
