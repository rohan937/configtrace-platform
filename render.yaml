# render.yaml — ConfigTrace infrastructure-as-code for Render
#
# Defines three services:
#   1. configtrace-api    — FastAPI web service (Docker, Render-injected $PORT)
#   2. configtrace-worker — Celery background worker (Docker)
#   3. configtrace-beat   — Celery Beat scheduler (Docker, M23)
#
# External dependencies created separately in your provider dashboards:
#   PostgreSQL  →  Neon, Supabase, or Render Postgres
#   Redis       →  Upstash or Render Redis
#
# After first deploy, set all envVars marked "sync: false" in the Render
# dashboard (service → Environment tab) or via the Render CLI.
#
# Full deployment guide: docs/deployment.md

services:
  # ── Backend API ──────────────────────────────────────────────────────────────
  - type: web
    name: configtrace-api
    runtime: docker
    plan: starter
    rootDir: backend
    dockerfilePath: ./Dockerfile
    # Render injects $PORT at runtime. dockerCommand overrides the Dockerfile CMD
    # which hardcodes port 8000 — necessary because Render's router expects the
    # app to bind the port it advertises.
    # Note: startCommand is for native runtimes only; Docker runtime uses dockerCommand.
    dockerCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    # Migrations run before each new deploy. Alembic upgrade head is idempotent
    # (a no-op if the schema is already current).
    preDeployCommand: alembic upgrade head
    envVars:
      # Non-secret values set here — safe to commit.
      - key: ENVIRONMENT
        value: production
      - key: BACKEND_CORS_ORIGINS
        value: https://app.configtrace.org,https://configtrace.org

      # Secrets — set these in the Render dashboard, never in this file.
      # sync: false means Render will prompt for the value on first deploy.
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      # Milestone 21 — JWKS endpoint used to verify Clerk JWTs.  Missing or
      # placeholder values cause every protected route to return HTTP 503.
      - key: CLERK_JWKS_URL
        sync: false

      # ── Milestone 24 — High-risk email alerts ──────────────────────────────
      # The API service does NOT send alert emails; the worker does.  These
      # are declared here purely to keep the env surface consistent across
      # services (so a future code path that adds API-side email sending
      # doesn't fail at import time).
      - key: RESEND_API_KEY
        sync: false
      - key: ALERTS_FROM_EMAIL
        sync: false
      # Used to build deep links in alert email bodies.  Safe to commit.
      - key: APP_BASE_URL
        value: https://app.configtrace.org

      # ── Milestone 31 — GitHub App integration ──────────────────────────────
      # See docs/deployment.md → "GitHub App setup" for the creation runbook.
      # All four vars are required for the GitHub App flow.  When omitted,
      # the App install endpoints return HTTP 503 and the PAT flow still works.
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_SLUG
        sync: false
      # base64-encode the PEM: base64 -w 0 private-key.pem
      # NEVER paste the raw PEM here — newlines are mangled by Render.
      - key: GITHUB_APP_PRIVATE_KEY
        sync: false
      - key: GITHUB_APP_OAUTH_STATE_SECRET
        sync: false

  # ── Celery worker ────────────────────────────────────────────────────────────
  # Processes sync tasks enqueued by POST /syncs.
  # Shares the same Docker image as the API; only the dockerCommand differs.
  - type: worker
    name: configtrace-worker
    runtime: docker
    plan: starter
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerCommand: celery -A app.workers.celery_app worker --loglevel=info
    envVars:
      - key: ENVIRONMENT
        value: production

      # Must match the API service — worker reads the same DB and Redis.
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      # Worker doesn't verify JWTs at runtime; setting CLERK_JWKS_URL keeps
      # the image surface identical to the API and avoids drift.
      - key: CLERK_JWKS_URL
        sync: false

      # ── Milestone 24 — High-risk email alerts ──────────────────────────────
      # These ARE used at runtime by configtrace-worker — when a sync detects
      # a high or critical change, the worker POSTs to Resend with this key.
      # Missing values cause alert dispatch to log a warning and skip sending;
      # the DNS sync itself still completes.
      - key: RESEND_API_KEY
        sync: false
      - key: ALERTS_FROM_EMAIL
        sync: false
      # Used to build deep links in alert email bodies.  Safe to commit.
      - key: APP_BASE_URL
        value: https://app.configtrace.org

      # ── Milestone 31 — GitHub App integration ──────────────────────────────
      # Worker mints installation tokens at sync time — all four vars required.
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_SLUG
        sync: false
      - key: GITHUB_APP_PRIVATE_KEY
        sync: false
      - key: GITHUB_APP_OAUTH_STATE_SECRET
        sync: false

  # ── Celery Beat scheduler (Milestone 23) ────────────────────────────────────
  # Fires the ``enqueue_scheduled_syncs`` task at minute 0 of every hour.
  # The task itself is tiny — it sends a Redis message that the worker picks
  # up.  Beat does NOT spawn prefork worker children and does NOT execute
  # sync work itself, so a small Starter plan is plenty.
  #
  # Steady-state memory: ~50-80 MB.  Beat is single-process by design.
  - type: worker
    name: configtrace-beat
    runtime: docker
    plan: starter
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerCommand: celery -A app.workers.celery_app beat --loglevel=info
    envVars:
      - key: ENVIRONMENT
        value: production

      # Beat reads only Redis (broker) at runtime; it never opens a DB
      # connection.  The DB-touching work happens inside the
      # ``enqueue_scheduled_syncs`` task, which runs on configtrace-worker.
      # We still set DATABASE_URL here so pydantic-settings doesn't fail
      # at import time (the Settings class declares DATABASE_URL as required).
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      # Match the worker service's env surface for parity, even though Beat
      # never verifies JWTs.  Avoids subtle drift if a future code path lands
      # in the beat process's import graph.
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_JWKS_URL
        sync: false

      # ── Milestone 24 — declared for env-surface parity only ───────────────
      # Beat does not send alert emails (it only dispatches the
      # ``enqueue_scheduled_syncs`` task into Redis).  We declare these so
      # ``app.config.Settings`` validates identically on every service.
      - key: RESEND_API_KEY
        sync: false
      - key: ALERTS_FROM_EMAIL
        sync: false
      - key: APP_BASE_URL
        value: https://app.configtrace.org

      # ── Milestone 31 — GitHub App vars intentionally omitted from Beat ────
      # All four GITHUB_APP_* settings are Optional[str] = None in
      # app.config.Settings, so pydantic-settings validates without them.
      # Beat never routes HTTP requests, never mints App JWTs, and never
      # calls the GitHub App installation flow.  Setting them here would
      # require Render credentials that Beat has no use for.
